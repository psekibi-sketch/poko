<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="pokoFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#60A5FA" stroke-width="8" stroke-dasharray="16 12" opacity="0.6"/>

  <!-- Poko Ears -->
  <circle cx="150" cy="160" r="50" fill="#F59E0B"/>
  <circle cx="150" cy="160" r="30" fill="#FDE68A"/>
  <circle cx="362" cy="160" r="50" fill="#F59E0B"/>
  <circle cx="362" cy="160" r="30" fill="#FDE68A"/>

  <!-- Poko Head -->
  <circle cx="256" cy="270" r="145" fill="url(#pokoFace)"/>

  <!-- Cheeks -->
  <ellipse cx="170" cy="310" rx="24" ry="16" fill="#F87171" opacity="0.7"/>
  <ellipse cx="342" cy="310" rx="24" ry="16" fill="#F87171" opacity="0.7"/>

  <!-- Big Sparkling Eyes -->
  <circle cx="205" cy="250" r="26" fill="#1E293B"/>
  <circle cx="197" cy="242" r="9" fill="#FFFFFF"/>
  <circle cx="213" cy="256" r="4" fill="#FFFFFF"/>

  <circle cx="307" cy="250" r="26" fill="#1E293B"/>
  <circle cx="299" cy="242" r="9" fill="#FFFFFF"/>
  <circle cx="315" cy="256" r="4" fill="#FFFFFF"/>

  <!-- Cute Nose -->
  <ellipse cx="256" cy="278" rx="10" ry="7" fill="#78350F"/>

  <!-- Happy Big Smile -->
  <path d="M 226 295 Q 256 345 286 295" fill="#EF4444" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>

  <!-- Cap / Star Badge -->
  <polygon points="256,70 270,110 312,110 278,135 292,175 256,150 220,175 234,135 200,110 242,110" fill="url(#starGrad)" stroke="#B45309" stroke-width="3"/>

  <!-- Banner text -->
  <rect x="96" y="420" width="320" height="60" rx="30" fill="#FFFFFF"/>
  <text x="256" y="462" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#1D4ED8" text-anchor="middle">POKO KIDS</text>
</svg>
